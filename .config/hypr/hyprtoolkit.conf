# hyprtoolkit theme (Nord)
# Used by every hyprtoolkit app: hyprshutdown, hyprlauncher, hyprpolkitagent, ...
# Colors are 0xAARRGGBB, same palette as colors.css

background       = 0xFF2E3440   # nord0
base             = 0xFF3B4252   # nord1
alternate_base   = 0xFF434C5E   # nord2
text             = 0xFFD8DEE9   # nord4
bright_text      = 0xFFECEFF4   # nord6
link_text        = 0xFF88C0D0   # nord8
accent           = 0xFF88C0D0   # nord8 (ice)
accent_secondary = 0xFF5E81AC   # nord10 (blue)

font_family           = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font Mono
icon_theme            = NordArc-Icons

h1_size         = 22
h2_size         = 16
h3_size         = 13
font_size       = 11
small_font_size = 10

# match decoration.rounding in hyprconf/look.lua
rounding_large = 6
rounding_small = 3
