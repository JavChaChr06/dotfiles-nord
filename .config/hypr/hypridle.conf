general {
    lock_cmd = pidof hyprlock || blazinlock -i $HOME/.wallpaper/Nordic-mountain-wallpaper.jpg
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
	timeout = 180
	on-timeout = "hyprsunset -g 70"
	on-resume = "hyprsunset -g 100"
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

